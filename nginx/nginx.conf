server {
    listen 80;
    server_name _;

    # 门户首页
    location / {
        proxy_pass http://library-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 图书管理系统
    location /library/ {
        proxy_pass http://library-frontend:80/;
        proxy_set_header Host $host;
    }

    # 学生管理系统
    location /student/ {
        proxy_pass http://student-frontend:80/;
        proxy_set_header Host $host;
    }

    # Library API
    location /api/library/ {
        rewrite ^/api/library/(.*) /api/$1 break;
        proxy_pass http://library-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/auth/ {
        rewrite ^/api/auth/(.*) /api/auth/$1 break;
        proxy_pass http://library-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Student API
    location /api/student/ {
        rewrite ^/api/student/(.*) /api/$1 break;
        proxy_pass http://student-backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI Gateway — SSE流式需要特殊处理
    location /api/ai/ {
        proxy_pass http://ai-gateway:8082/api/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    # 通用API（图书管理）
    location /api/ {
        proxy_pass http://library-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
