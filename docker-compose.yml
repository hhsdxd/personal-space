version: "3.8"

services:
  # ========== 基础设施 ==========
  mysql:
    image: mysql:8.0
    container_name: ps-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ps-net

  redis:
    image: redis:7-alpine
    container_name: ps-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ps-net

  # ========== 后端服务 ==========
  library-backend:
    build: ./library-management/backend
    container_name: ps-library-backend
    restart: unless-stopped
    environment:
      - MYSQL_URL=jdbc:mysql://mysql:3306/library_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET_LIBRARY=${JWT_SECRET_LIBRARY}
      - LIBRARY_PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ps-net

  student-backend:
    build: ./student-management/backend
    container_name: ps-student-backend
    restart: unless-stopped
    environment:
      - MYSQL_URL=jdbc:mysql://mysql:3306/student_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET_STUDENT=${JWT_SECRET_STUDENT}
      - STUDENT_PORT=8081
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ps-net

  ai-gateway:
    build: ./ai-gateway
    container_name: ps-ai-gateway
    restart: unless-stopped
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_MODEL=${DASHSCOPE_MODEL:-qwen-plus}
      - AI_GATEWAY_PORT=8082
    networks:
      - ps-net

  # ========== 前端服务 ==========
  library-frontend:
    build: ./library-management/frontend
    container_name: ps-library-frontend
    restart: unless-stopped
    networks:
      - ps-net

  student-frontend:
    build: ./student-management/frontend
    container_name: ps-student-frontend
    restart: unless-stopped
    networks:
      - ps-net

  # ========== 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: ps-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - library-backend
      - student-backend
      - ai-gateway
      - library-frontend
      - student-frontend
    networks:
      - ps-net

networks:
  ps-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
